  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

   <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>

    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.358.0.min.js"></script>

    <script>
      AWS.config.region = 'us-east-1';
      AWS.config.credentials = new AWS.CognitoIdentityCredentials({
        IdentityPoolId: 'us-east-1:cefcbeb5-2542-4839-9f15-41524a0e5254',
      });

      $(document).on('submit', 'form#contact-form', function(e) {
        e.preventDefault();
        var params = {
          Destination: { ToAddresses: ['muhammadabubakarkhan1234@gmail.com'] },
          Message: {
            Body: {
              Html: {
                Charset: "UTF-8",
                Data: $('#messagetext').val()
              }
            },
            Subject: {
              Charset: 'UTF-8',
              Data: 'Portfolio Contact from ' + $('#name').val() + ' | ' + $('#emailid').val()
            }
          },
          Source: 'muhammadabubakarkhan1234@gmail.com',
        };
        new AWS.SES({apiVersion: '2010-12-01'}).sendEmail(params).promise()
          .then(function() { alert("Message sent! I'll get back to you soon."); })
          .catch(function() { alert("Something went wrong. Please email me directly."); });
      });
    </script>
